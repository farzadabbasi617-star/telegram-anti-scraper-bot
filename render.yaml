# ================================================================
# 🚀 Render — سرویس اختصاصی همین ربات (اسکرپر/ادد ممبر)
#
# ⚠️ این ربات باید سرویس Render مستقل خودش را داشته باشد.
#    ربات‌های دیگر این حساب (بات داوری و بات تورنومنت در ریپو Flexa_app)
#    فریم‌ورک متفاوتی دارند و هرگز نباید در همین سرویس اجرا شوند.
#
# ⚠️ هر ربات = یک BOT_TOKEN جدا. اگر دو پروسه با یک توکن getUpdates بزنند
#    تلگرام هر دو را با خطای «Conflict: terminated by other getUpdates» می‌شکند.
# ================================================================
services:
  - type: web
    name: haghbakie-scraper
    env: python
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # --- الزامی: از داشبورد Render پر کن، هرگز در گیت کامیت نکن ---
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        sync: false

      # --- رمزنگاری سشن اکانت‌ها ---
      #
      # ⚠️ هشدار: این کلید را روی سرویسی که از قبل سشن ذخیره‌شده دارد
      #    اضافه یا عوض نکن. سشن‌های موجود با کلید فعلی (یا بدون کلید)
      #    نوشته شده‌اند؛ تغییر کلید یعنی همه اکانت‌ها باید دوباره لاگین کنند.
      #
      # برای سرویس جدید و خالی: مقدار دلخواه بگذار و دیگر عوضش نکن.
      # برای سرویس فعلی: دست نزن.
      - key: SESSION_ENCRYPTION_KEY
        sync: false

      # --- سرور و مینی‌اپ ---
      - key: PORT
        value: '10000'
      - key: KEEP_ALIVE_INTERVAL
        value: '280'

      # --- دیتابیس ---
      - key: DB_POOL_SIZE
        value: '10'

      # --- موتور ادد (ضد بن) ---
      - key: MAX_ADD_PER_ACCOUNT
        value: '1000'
      - key: CAP_MAX
        value: '100000'
      - key: CAP_ULTRA
        value: '1000'
      - key: CAP_FAST
        value: '1000'
      - key: CAP_SAFE
        value: '1000'
      - key: GLOBAL_THROTTLE_ENABLED
        value: 'true'
      - key: DEFAULT_TARGET_USERNAME
        sync: false

      # --- دفاع گروه ---
      # off = هیچ تله‌ای در گروه کاشته نمی‌شود. نسخه ۱.۴.۰ کد قابل‌مشاهده
      # می‌فرستاد و اعضا آن را اسکم تصور کرده و گروه را ترک می‌کردند.
      - key: HONEYPOT_MODE
        value: 'off'

      # --- لاگینگ ---
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_DIR
        value: logs
